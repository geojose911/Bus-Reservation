<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Bus Reservation System retro logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c873"/>
      <stop offset="100%" stop-color="#e86a4f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
    </filter>
    <style>
      .main { font-family: Georgia, "Times New Roman", serif; font-weight: 900; letter-spacing: 3px; fill: #fff8ef; }
      .sub { font-family: Georgia, "Times New Roman", serif; font-weight: 700; letter-spacing: 10px; fill: #fff8ef; opacity: 0.95; }
      .small { font-family: Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 4px; fill: #113a57; }
    </style>
  </defs>
  <rect x="28" y="30" width="1144" height="340" rx="30" fill="#113a57" filter="url(#shadow)"/>
  <rect x="52" y="54" width="1096" height="292" rx="24" fill="url(#bg)"/>
  <rect x="52" y="54" width="1096" height="292" rx="24" filter="url(#grain)" opacity="0.35"/>
  <path d="M110 320H1090" stroke="#fff3d9" stroke-width="5" stroke-dasharray="18 12" opacity="0.9"/>
  <path d="M110 84H1090" stroke="#fff3d9" stroke-width="5" stroke-dasharray="18 12" opacity="0.9"/>
  <circle cx="52" cy="200" r="26" fill="#113a57"/>
  <circle cx="1148" cy="200" r="26" fill="#113a57"/>
  <g transform="translate(600 162)">
    <text x="0" y="0" font-size="60" text-anchor="middle" class="main">BUS RESERVATION</text>
    <text x="0" y="72" font-size="40" text-anchor="middle" class="sub">SYSTEM</text>
  </g>
  <g transform="translate(600 286)">
    
  </g>
</svg>
